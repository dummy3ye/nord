[project]
name = "nordify"
version = "2.1.0"
description = "Transform any image into Nord-themed art — photos, selfies, screenshots, logos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "raven" },
]
keywords = ["nord", "color-palette", "image-processing", "theme", "filter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "numpy>=1.22",
    "Pillow>=9.0",
]

[project.scripts]
nordify = "nordify:main"

[project.urls]
Repository = "https://github.com/dummy3ye/nord"
Homepage = "https://github.com/dummy3ye/nord"
Issues = "https://github.com/dummy3ye/nord/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
